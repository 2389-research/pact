# ABOUTME: GoReleaser config for pact — pure-Go (CGO-free) builds for
# ABOUTME: macOS and Linux with tar.gz archives and a conventional-commit changelog.
version: 2

project_name: pact

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: pact
    binary: pact
    main: ./cmd/pact
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: pact
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

# Presumed future home; update if the repo lands elsewhere. Until a remote
# exists, goreleaser cannot infer this and `goreleaser check` fails without it.
release:
  github:
    owner: 2389-research
    name: pact

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: 'Features'
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: 'Other'
      order: 999
